name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests
        run: npm test

      - name: CLI help
        run: node bin/agent-sync.mjs help

      - name: Demo apply + check
        run: |
          node bin/agent-sync.mjs -C examples/demo-project apply
          node bin/agent-sync.mjs -C examples/demo-project check
          node bin/agent-sync.mjs -C examples/demo-project status
